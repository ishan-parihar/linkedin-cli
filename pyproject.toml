[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-cli"
version = "5.0.0"
description = "LinkedIn MCP server using Obscura browser automation"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.1.1",
    "inquirer>=3.4.0",
    "obscura-cookie-manager @ git+https://github.com/ishan-parihar/obscura-cookie-manager.git",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
linkedin-cli = "linkedin_mcp_server.cli_main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
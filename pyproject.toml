[project]
name = "mcp-server-linkedin"
version = "5.0.0"
description = "MCP server with AXI-compliant CLI that gives AI assistants like Claude access to LinkedIn profiles, companies, and job postings through the user's own browser session. Fork of stickerdaniel/linkedin-mcp-server with enhanced agent integration."
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Daniel Sticker", email = "daniel@sticker.name" },
    { name = "Ishan", email = "ishan@example.com" }
]
license = "Apache-2.0"
keywords = [
    "mcp",
    "model-context-protocol",
    "ai",
    "llm",
    "anthropic",
    "claude",
    "axi",
    "linkedin",
    "obscura",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiohttp>=3.12.13",
    "browser-cookie3>=0.20.1",
    "cryptography>=48.0.1",
    "fastmcp>=3.4.4",
    "httpx>=0.27.0",
    "inquirer>=3.4.0",
    "packaging>=26.2",
    "patchright>=1.61.2",
    "python-dotenv>=1.1.1",
]

[project.urls]
Homepage = "https://github.com/ishan-parihar/linkedin-cli"
Documentation = "https://github.com/ishan-parihar/linkedin-cli#readme"
Repository = "https://github.com/ishan-parihar/linkedin-cli"
Issues = "https://github.com/ishan-parihar/linkedin-cli/issues"
Changelog = "https://github.com/ishan-parihar/linkedin-cli/releases"
Original-Project = "https://github.com/stickerdaniel/linkedin-mcp-server"

[project.scripts]
mcp-server-linkedin = "linkedin_mcp_server.cli_main:main"
linkedin-cli-import = "linkedin_mcp_server.linkedin_cli_full:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["linkedin_mcp_server*"]
exclude = ["assets*", "docs*", "tests*"]

[tool.setuptools.package-data]
linkedin_mcp_server = ["py.typed"]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.11.11",
    "ty>=0.0.1a12",
]
